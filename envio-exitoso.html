<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envío Exitoso</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link rel="stylesheet" href="css/envio-exitoso.css" />
</head>
<body>
    <main class="flex-grow flex items-center justify-center relative px-6 py-6 min-h-screen">
        
        <div class="relative z-10 w-full max-w-sm rounded-xl p-8">
            <div class="flex flex-col items-center text-center">
                
                <!-- Success Icon Wrapper -->
                <div class="w-24 h-24 rounded-full flex items-center justify-center mb-6" style="background-color: rgba(0, 102, 204, 0.1);">
                    <span class="material-symbols-outlined" id="success-icon" style="font-variation-settings: 'FILL' 1; font-size: 56px; color: #0066cc;">
                        check_circle
                    </span>
                </div>
                
                <!-- Headline -->
                <h2 class="text-[28px] font-bold mb-3" style="color: #131b2e;">
                    ¡Envío Exitoso!
                </h2>
                
                <!-- Description -->
                <p class="text-[16px] mb-10 leading-relaxed" style="color: #45464d;">
                    Tu reporte ha sido enviado correctamente. Nuestro equipo lo revisará pronto y tomará las acciones necesarias.
                </p>
                
                <!-- Primary Action Button -->
                <a class="w-full text-white py-4 px-6 rounded-lg font-semibold text-center transition-all duration-200 active:scale-95 hover:opacity-90" 
                   href="principal.html" 
                   id="btn-volver-inicio"
                   style="background-color: #0066cc;">
                    Volver al Inicio
                </a>
                
            </div>
        </div>
        
    </main>
    <script src="js/envio-exitoso.js"></script>
</body>
</html>
