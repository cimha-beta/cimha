<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Generando Pronóstico</title>

    <!-- ✅ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- ✅ CSS Personalizado -->
    <link rel="stylesheet" href="css/carga-pronostico.css" />
</head>

<body>
    <!-- ============================================ -->
    <!-- STATUS BAR (VACÍO)                           -->
    <!-- ============================================ -->
    <header class="flex justify-between items-center px-8 py-4 w-full"></header>

    <!-- ============================================ -->
    <!-- MAIN CONTENT                                -->
    <!-- ============================================ -->
    <main class="flex-grow flex flex-col items-center justify-center px-10 text-center">
        <div class="bg-white rounded-2xl border border-gray-300 shadow-[0_8px_30px_rgba(0,0,0,0.3)] p-6 w-fit">

        <!-- Central Processing Visual -->
        <div class="relative flex items-center justify-center mb-2">
            <div class="w-[170px] h-[170px] flex items-center justify-center relative">

                <!-- Background Decorative Path -->
                <div class="absolute w-[155px] h-[155px] rounded-full border border-blue-50 border-2"></div>

                <!-- Central Circle with Icon -->
                <div
                    class="w-[130px] h-[130px] bg-white rounded-full central-circle-shadow flex items-center justify-center z-10">
                    <div class="flex flex-col items-center">
                        <div class="relative w-30 h-30">
                            <video class="w-full h-full object-contain" id="loading-video" autoplay muted loop playsinline src="assets/video_icono_reloj_carga.mp4"></video>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Titles and Description -->
        <h1 class="text-headline-lg-mobile font-bold text-on-surface mb-stack-md">Generando Pronóstico
        </h1>
        <p class="text-body-lg font-body-lg text-on-surface-variant leading-relaxed mb-6 max-w-[280px]">
            Este proceso puede tardar unos minutos.<br />
        </p>

        <!-- Multi-phase Loading Loop -->
        <div class="w-full max-w-[280px] mb-10 flex flex-col items-center">

            <!-- Status Text -->
            <p class="text-sm font-medium text-on-surface-variant mb-3 transition-opacity duration-300"
                id="status-text">
                Iniciando proceso...
            </p>

            <!-- Progress Bar -->
            <div class="w-full border-2 border-on-surface h-5 rounded-xl overflow-hidden" id="loading-container">
                <div class="h-full bg-green-500 transition-all duration-500 ease-out rounded-sm" id="loading-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Cancel Button -->
        <button
            class="w-full max-w-[280px] py-4 bg-red-600 rounded-xl flex items-center justify-center space-x-2 text-white font-bold active:bg-red-700 transition-colors"
            id="cancel-button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
            <span>Cancelar</span>
        </button>

        </div>
    </main>

    <!-- Cancel Modal -->
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden" id="cancel-modal">
        <div class="modal-content bg-white rounded-2xl p-8 mx-4 max-w-sm w-full flex flex-col items-center text-center shadow-2xl">
            <video class="w-24 h-24 object-contain mb-4" id="cancel-video" autoplay muted playsinline src="assets/video_icono_cancelacion.mp4"></video>
            <h2 class="text-xl font-bold text-gray-900 mb-2">Proceso Cancelado</h2>
            <p class="text-gray-500 mb-6">El proceso fue cancelado.<br> Se redirigira a la pantalla Principal.</p>
            <button class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-red-700 transition-colors" id="modal-ok-btn">Aceptar</button>
        </div>
    </div>

    <!-- ✅ JavaScript -->
    <script src="js/carga-pronostico.js"></script>
</body>

</html>
